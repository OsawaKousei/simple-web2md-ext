volumes:
  kupacllc-home-page-node-modules:

services:
  kupacllc-home-page-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/app:/app
      - kupacllc-home-page-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - kupacllc-home-page-app-network

networks:
  kupacllc-home-page-app-network:
    driver: bridge
