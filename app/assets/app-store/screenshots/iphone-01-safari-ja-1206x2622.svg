<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1206"
  height="2622"
  viewBox="0 0 1206 2622"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Safariから、Markdownで保存。</title>
  <desc id="desc">
    iPhone
    SEの実機で撮影したSafariの機能拡張メニューを、縦横比を保って掲載しています。画面内の内容は元のスクリーンショットのままです。
  </desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#edf6f2" />
      <stop offset="1" stop-color="#f8fbfa" />
    </linearGradient>
  </defs>
  <rect width="1206" height="2622" fill="url(#background)" />
  <circle cx="1130" cy="180" r="310" fill="#dceee6" opacity="0.6" />
  <g
    font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, sans-serif"
    fill="#123047"
  >
    <text x="96" y="108" font-size="34" font-weight="700">Web to Markdown</text>
    <text x="96" y="176" font-size="27" fill="#52756a">Safari 機能拡張</text>
    <text x="96" y="278" font-size="74" font-weight="700">Safariから、</text>
    <text x="96" y="374" font-size="74" font-weight="700">
      Markdownで保存。
    </text>
    <text x="96" y="440" font-size="30" fill="#526b78">
      ページメニューから Web to Markdown を実行。
    </text>
    <rect x="88" y="482" width="1030" height="1820" rx="8" fill="#c9e2d9" />
    <image
      href="../IMG_0004.PNG"
      x="96"
      y="490"
      width="1014"
      height="1804"
      preserveAspectRatio="xMidYMid meet"
    />
    <text x="96" y="2410" font-size="36" font-weight="700">
      アカウント登録不要。端末内で変換。
    </text>
    <text x="96" y="2484" font-size="27" fill="#52756a">
      iPhone SE（第2世代）の実機画面
    </text>
  </g>
</svg>
