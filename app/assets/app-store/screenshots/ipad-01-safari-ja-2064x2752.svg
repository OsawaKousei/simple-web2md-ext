<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2064"
  height="2752"
  viewBox="0 0 1032 1376"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Safariから、Markdownで保存。</title>
  <desc id="desc">
    iPad Pro
    13インチのシミュレーターで撮影したSafariの機能拡張メニューを、縦横比を保って掲載しています。
  </desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#edf6f2" />
      <stop offset="1" stop-color="#f8fbfa" />
    </linearGradient>
  </defs>
  <rect width="1032" height="1376" fill="url(#background)" />
  <circle cx="1000" cy="160" r="280" fill="#dceee6" opacity="0.6" />
  <g
    font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, sans-serif"
    fill="#123047"
  >
    <text x="72" y="72" font-size="26" font-weight="700">Web to Markdown</text>
    <text x="72" y="120" font-size="20" fill="#52756a">Safari 機能拡張</text>
    <text x="72" y="198" font-size="58" font-weight="700">Safariから、</text>
    <text x="72" y="272" font-size="58" font-weight="700">
      Markdownで保存。
    </text>
    <text x="72" y="322" font-size="22" fill="#526b78">
      機能拡張メニューから Web to Markdown を実行。
    </text>
    <rect x="166" y="344" width="700" height="929.333" rx="6" fill="#c9e2d9" />
    <image
      href="ipad-safari-raw.png"
      x="172"
      y="350"
      width="688"
      height="917.333"
      preserveAspectRatio="xMidYMid meet"
    />
    <text x="72" y="1314" font-size="25" font-weight="700">
      アカウント登録不要。端末内で変換。
    </text>
    <text x="72" y="1352" font-size="18" fill="#52756a">
      iPad Pro 13インチのシミュレーター画面
    </text>
  </g>
</svg>
