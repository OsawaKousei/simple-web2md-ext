<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2560"
  height="1600"
  viewBox="0 0 1280 800"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">設定したら、Safariからすぐ保存。</title>
  <desc id="desc">
    実際のMacアプリの有効化案内画面と、有効化・ページ表示・Markdown保存の3つの操作手順。
  </desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#edf6f2" />
      <stop offset="1" stop-color="#f8fbfa" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dy="16" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="492" y="263" width="724" height="452.5" rx="18" />
    </clipPath>
  </defs>
  <rect width="1280" height="800" fill="url(#background)" />
  <circle cx="1130" cy="490" r="300" fill="#dceee6" opacity="0.5" />
  <g font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, sans-serif">
    <image
      href="../../../public/icons/icon.svg"
      x="64"
      y="39"
      width="42"
      height="42"
    />
    <text x="120" y="69" font-size="24" font-weight="700" fill="#123047">
      Web to Markdown
    </text>
    <text
      x="1216"
      y="67"
      text-anchor="end"
      font-size="16"
      font-weight="500"
      fill="#52756a"
    >
      Safari 拡張機能
    </text>
    <text
      x="64"
      y="159"
      font-size="47"
      font-weight="700"
      letter-spacing="-1.8"
      fill="#123047"
    >
      設定したら、Safariからすぐ保存。
    </text>
    <text x="66" y="205" font-size="21" fill="#526b78">
      一度有効にすれば、Safari の機能拡張から実行できます。
    </text>

    <path d="M88 311v265" stroke="#c9e2d9" stroke-width="2" />
    <g fill="#00aa8d">
      <circle cx="88" cy="311" r="24" />
      <circle cx="88" cy="444" r="24" />
      <circle cx="88" cy="577" r="24" />
    </g>
    <g fill="#fff" font-size="21" font-weight="700" text-anchor="middle">
      <text x="88" y="319">1</text>
      <text x="88" y="452">2</text>
      <text x="88" y="585">3</text>
    </g>
    <g fill="#123047" font-size="25" font-weight="700">
      <text x="130" y="319">有効にする</text>
      <text x="130" y="452">ページを開く</text>
      <text x="130" y="585">Markdown で保存</text>
    </g>
    <g fill="#526b78" font-size="17">
      <text x="130" y="354">Safari の設定で</text>
      <text x="130" y="381">機能拡張を有効にします。</text>
      <text x="130" y="487">保存したい記事を</text>
      <text x="130" y="514">Safari で表示します。</text>
      <text x="130" y="620">機能拡張を実行して、</text>
      <text x="130" y="647">.md ファイルに。</text>
    </g>

    <text x="494" y="246" font-size="15" font-weight="500" fill="#52756a">
      実際の Mac アプリ：有効化の案内画面
    </text>
    <rect
      x="492"
      y="263"
      width="724"
      height="452.5"
      rx="18"
      fill="#202020"
      filter="url(#shadow)"
    />
    <image
      href="mac-onboarding.jpg"
      x="492"
      y="263"
      width="724"
      height="452.5"
      clip-path="url(#screen)"
    />

    <rect x="64" y="744" width="1152" height="36" rx="12" fill="#e0f0e8" />
    <circle cx="84" cy="762" r="5" fill="#00aa8d" />
    <text x="100" y="769" font-size="16" font-weight="500" fill="#315e58">
      変換処理は端末内。ページ内容や変換結果を開発者のサーバーへ送信しません。
    </text>
  </g>
</svg>
