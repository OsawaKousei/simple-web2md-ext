<svg
  xmlns="http://www.w3.org/2000/svg"
  width="3840"
  height="1646"
  viewBox="0 0 1920 823"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Web to Markdown — ウェブの情報を、自分のファイルに。</title>
  <desc id="desc">
    淡いミント色の背景に、記事ページからMarkdownファイルへの変換を表現したプロモーション用イラスト。
  </desc>
  <defs>
    <radialGradient id="glow" cx="62%" cy="45%" r="65%">
      <stop offset="0" stop-color="#fff" />
      <stop offset="1" stop-color="#e7f1ef" />
    </radialGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#f7fbfa" />
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#1b4558" />
      <stop offset="1" stop-color="#123047" />
    </linearGradient>
    <filter id="shadow" x="-60%" y="-40%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dy="18" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.13" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#abcfc7" />
    </pattern>
  </defs>

  <rect x="-2000" y="-2000" width="6000" height="5000" fill="url(#glow)" />
